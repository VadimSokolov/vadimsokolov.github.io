<script>
const groups = [
  {
    name: "Probability",
    items: [
      {
        title: "A legal table, and a marginal",
        tex: String.raw`\htmlClass{term c1}{\sum p}=1,\qquad \htmlClass{term c2}{P(X=x)}=\htmlClass{term c3}{\sum_y P(X=x,\,Y=y)}`,
        parts: [
          "Every entry is between 0 and 1, and ",
          { k: "c1", words: "the entries add to 1" },
          ". The ",
          { k: "c2", words: "marginal chance of one value of X" },
          " is ",
          { k: "c3", words: "the sum of the joint chances in that row" },
          "."
        ],
        notes: {
          c1: "A column sum is the marginal of Y. If the entries do not add to 1, the table is not a probability distribution.",
          c2: "Read a marginal off the edge of the table, after you have added.",
          c3: "Do not divide yet. Dividing is the next formula, the conditional."
        }
      },
      {
        title: "Conditional probability",
        tex: String.raw`\htmlClass{term c4}{P(X=x\mid Y=y)}=\frac{\htmlClass{term c2}{P(X=x,\,Y=y)}}{\htmlClass{term c3}{P(Y=y)}}`,
        parts: [
          "The ",
          { k: "c4", words: "chance of this x among the cases with this y" },
          " is ",
          { k: "c2", words: "the joint chance in that cell" },
          ", divided by ",
          { k: "c3", words: "the marginal chance of y" },
          "."
        ],
        notes: {
          c4: "In a table, divide one column by that column's sum. Dividing by a row sum answers a different question.",
          c2: "The numerator is one cell, not a marginal.",
          c3: "The cells in the column, after you divide, are a distribution: they add to 1."
        }
      },
      {
        title: "Complement",
        tex: String.raw`\htmlClass{term c1}{P(\bar A)}=\htmlClass{term c2}{1}-\htmlClass{term c3}{P(A)}`,
        parts: [
          "The ",
          { k: "c1", words: "chance that A does not happen" },
          " is ",
          { k: "c2", words: "one" },
          " minus ",
          { k: "c3", words: "the chance that A happens" },
          "."
        ],
        notes: {
          c1: "Use this for \"at least one\" and for \"at least two\": compute the cases you do not want, then subtract from 1.",
          c2: "The two chances add to 1. They are mutually exclusive and cover every outcome.",
          c3: "Specificity is this idea applied to a false alarm: if a clean case is flagged with chance 0.08, it is cleared with chance 0.92."
        }
      },
      {
        title: "The chance of at least one",
        tex: String.raw`\htmlClass{term c4}{P(A\text{ or }B)}=\htmlClass{term c2}{P(A)}+\htmlClass{term c3}{P(B)}-\htmlClass{term c5}{P(A\text{ and }B)}`,
        parts: [
          "The ",
          { k: "c4", words: "chance that at least one of the two happens" },
          " is ",
          { k: "c2", words: "the chance of A" },
          " plus ",
          { k: "c3", words: "the chance of B" },
          ", minus ",
          { k: "c5", words: "the chance of both" },
          "."
        ],
        notes: {
          c4: "\"Or\" here includes the case where both happen.",
          c2: "If you only add, the both is counted in A and again in B.",
          c3: "Same double count, from the other event.",
          c5: "Subtract the both once. If the two cannot happen together, this term is 0 and the chances just add."
        }
      },
      {
        title: "Independence",
        tex: String.raw`\htmlClass{term c1}{P(A\text{ and }B)}=\htmlClass{term c2}{P(A)\,P(B)}\qquad\text{and}\qquad \htmlClass{term c4}{P(A\mid B)}=\htmlClass{term c3}{P(A)}`,
        parts: [
          "A and B are independent when ",
          { k: "c1", words: "the chance of both" },
          " equals ",
          { k: "c2", words: "the product of the two chances" },
          ". Equivalently, ",
          { k: "c4", words: "the chance of A given B" },
          " equals ",
          { k: "c3", words: "the chance of A" },
          "."
        ],
        notes: {
          c1: "On a table, check one cell: the joint chance has to equal the product of its row and column margins. One cell that fails is enough.",
          c2: "Multiplying is legal only when the events are independent, or when you are multiplying by a conditional probability.",
          c4: "Learning B does not move the chance of A.",
          c3: "Zero correlation is a different statement. It does not by itself give independence."
        }
      },
      {
        title: "Mean of one variable",
        tex: String.raw`\htmlClass{term c1}{E(X)}=\htmlClass{term c2}{\sum_x x\,P(X=x)}`,
        parts: [
          "The ",
          { k: "c1", words: "mean" },
          " is ",
          { k: "c2", words: "each value times its chance, added up" },
          "."
        ],
        notes: {
          c1: "Over many draws from this distribution, the average of the draws settles at this number. It is not a value that has to occur.",
          c2: "Use the marginal chances of X, unless the question asks for a conditional mean. Then use the conditional chances instead."
        }
      },
      {
        title: "Mean of a sum",
        tex: String.raw`\htmlClass{term c1}{E(aX+bY)}=\htmlClass{term c2}{a\,E(X)}+\htmlClass{term c3}{b\,E(Y)}`,
        parts: [
          "The ",
          { k: "c1", words: "mean of a weighted sum" },
          " is ",
          { k: "c2", words: "the weight times the mean of X" },
          " plus ",
          { k: "c3", words: "the weight times the mean of Y" },
          "."
        ],
        notes: {
          c1: "This holds whether or not X and Y are independent. Pay that is a fixed amount plus a piece of sales needs this, and it does not need independence.",
          c2: "A constant pulls out. A minus sign stays a minus sign, because this is a mean, not a variance.",
          c3: "Five days of sales have mean five times the daily mean, again with no independence assumption."
        }
      },
      {
        title: "Variance of a sum",
        tex: String.raw`\htmlClass{term c1}{\mathrm{Var}(aX+bY)}=\htmlClass{term c2}{a^2\mathrm{Var}(X)}+\htmlClass{term c2}{b^2\mathrm{Var}(Y)}+\htmlClass{term c5}{2ab\,\mathrm{Cov}(X,Y)}`,
        parts: [
          "The ",
          { k: "c1", words: "variance of a weighted sum" },
          " ",
          { k: "c2", words: "squares each weight and adds the variances" },
          ", and then adds ",
          { k: "c5", words: "twice the weights times the covariance" },
          "."
        ],
        notes: {
          c1: "Variance is not linear. Independence is not required to write the formula, but it sets the covariance to 0.",
          c2: "The weight is squared, so Var(2X−Y) is 4 Var(X) plus Var(Y) when X and Y are independent. A weight of −1 still contributes the full variance. The minus sign does not subtract a variance.",
          c5: "If the correlation is −1 and the standard deviations match, this term can cancel the two variances and the sum is constant."
        }
      },
      {
        title: "Covariance and correlation",
        tex: String.raw`\htmlClass{term c5}{\mathrm{Cov}(X,Y)}=\htmlClass{term c4}{\rho}\,\htmlClass{term c2}{\mathrm{sd}(X)}\,\htmlClass{term c3}{\mathrm{sd}(Y)}`,
        parts: [
          "The ",
          { k: "c5", words: "covariance" },
          " is ",
          { k: "c4", words: "the correlation" },
          " times ",
          { k: "c2", words: "the standard deviation of X" },
          " times ",
          { k: "c3", words: "the standard deviation of Y" },
          "."
        ],
        notes: {
          c5: "Covariance is in the product of the units of X and Y. Correlation has no units.",
          c4: "Correlation is between −1 and 1. Zero correlation means no linear association. Y can still be a function of X, for example Y=X² with X symmetric about 0.",
          c2: "Do not put a variance here. The scaling uses standard deviations.",
          c3: "If both standard deviations are 1, covariance and correlation are the same number."
        }
      },
      {
        title: "Law of total expectation",
        tex: String.raw`\htmlClass{term c1}{E(X)}=\htmlClass{term c2}{\sum_y E(X\mid Y=y)\,P(Y=y)}`,
        parts: [
          "The ",
          { k: "c1", words: "overall mean" },
          " is ",
          { k: "c2", words: "the mean inside each group, weighted by the chance of that group" },
          "."
        ],
        notes: {
          c1: "Average within groups, then across groups. The result matches the mean you get from the marginal of X.",
          c2: "A group mean can rise and then fall. The weighted average does not say that more of Y always means more of X."
        }
      },
      {
        title: "A sum, and an average, of n draws",
        tex: String.raw`\htmlClass{term c2}{E(S)=n\mu},\ \ \htmlClass{term c3}{\mathrm{sd}(S)=\sqrt{n}\,\sigma},\qquad \htmlClass{term c4}{E(\bar X)=\mu},\ \ \htmlClass{term c5}{\mathrm{sd}(\bar X)=\sigma/\sqrt{n}}`,
        parts: [
          "For independent draws, ",
          { k: "c2", words: "the sum has mean n times μ" },
          " and ",
          { k: "c3", words: "standard deviation √n times σ" },
          ". ",
          { k: "c4", words: "Their average has mean μ" },
          " and ",
          { k: "c5", words: "standard deviation σ over √n" },
          "."
        ],
        notes: {
          c2: "Means add. This piece does not need independence. The standard deviation piece does.",
          c3: "The standard deviation of a sum grows like the square root of n, not like n. Variances add, and the standard deviation is the square root of the variance.",
          c4: "Averaging does not change the center.",
          c5: "Four times as many draws halves this standard deviation. A bigger sample of the same kind of draw does not fix a mean that was aimed at the wrong population."
        }
      },
      {
        title: "Law of total probability",
        tex: String.raw`\htmlClass{term c1}{P(B)}=\htmlClass{term c2}{P(B\mid A)P(A)}+\htmlClass{term c3}{P(B\mid \bar A)P(\bar A)}`,
        parts: [
          "The ",
          { k: "c1", words: "chance of B" },
          " is ",
          { k: "c2", words: "its chance when A is true, times how common A is" },
          ", plus ",
          { k: "c3", words: "its chance when A is false, times how common that is" },
          "."
        ],
        notes: {
          c1: "This is the denominator of Bayes rule. It counts every way B can happen.",
          c2: "One path: the claim is true, and the evidence shows up.",
          c3: "The other path: the claim is false, and the evidence shows up anyway. Leave this out and a rare claim looks certain."
        }
      },
      {
        title: "Bayes rule",
        tex: String.raw`\htmlClass{term c4}{P(A\mid B)}=\frac{\htmlClass{term c2}{P(B\mid A)}\,\htmlClass{term c3}{P(A)}}{\htmlClass{term c1}{P(B)}}`,
        parts: [
          "The ",
          { k: "c4", words: "chance of the claim given the evidence" },
          " is ",
          { k: "c2", words: "the chance of the evidence given the claim" },
          ", times ",
          { k: "c3", words: "how common the claim was before the evidence" },
          ", divided by ",
          { k: "c1", words: "how common the evidence is" },
          "."
        ],
        notes: {
          c4: "This is the probability the question asks for after a positive test.",
          c2: "This is the sensitivity. Reporting it as the answer is the prosecutor's fallacy.",
          c3: "The base rate. Two people with the same test and different base rates get different answers.",
          c1: "Compute this first, by the law of total probability."
        }
      },
      {
        title: "Sensitivity is not the posterior",
        tex: String.raw`\htmlClass{term c2}{P(T\mid S)}\ \text{and}\ \htmlClass{term c5}{P(\bar T\mid \bar S)},\qquad \text{the question is}\ \htmlClass{term c4}{P(S\mid T)}`,
        parts: [
          { k: "c2", words: "Sensitivity is the chance of a positive when the condition is present" },
          ". ",
          { k: "c5", words: "Specificity is the chance of a negative when it is absent" },
          ". The question after a positive result is ",
          { k: "c4", words: "the chance the condition is present" },
          "."
        ],
        notes: {
          c2: "P(evidence | claim). A test can catch 88% of users and still be wrong about most people it flags.",
          c5: "One minus the false-positive rate. If clean players are flagged 8% of the time, specificity is 0.92.",
          c4: "P(claim | evidence). Bayes rule, with the base rate, turns the first two numbers into this one."
        }
      },
      {
        title: "Odds",
        tex: String.raw`\htmlClass{term c3}{O}=\frac{P}{1-P},\qquad \htmlClass{term c1}{P}=\frac{O}{1+O},\qquad \htmlClass{term c4}{O_{\mathrm{after}}}=\htmlClass{term c2}{\frac{P(E\mid H)}{P(E\mid \bar H)}}\htmlClass{term c5}{O_{\mathrm{before}}}`,
        parts: [
          { k: "c3", words: "Odds in favor are the chance it happens, divided by the chance it does not" },
          ". ",
          { k: "c1", words: "The probability is those odds, divided by one plus the odds" },
          ". ",
          { k: "c4", words: "After the evidence, the odds" },
          " equal ",
          { k: "c2", words: "the Bayes factor" },
          " times ",
          { k: "c5", words: "the odds before" },
          "."
        ],
        notes: {
          c3: "Odds of 3 to 5 in favor mean O=3/5, so P=3/8, not 0.4 and not 3/5. Odds against are the reciprocal.",
          c1: "If you were given odds against, the probability is 1/(1+odds against).",
          c4: "Equal odds after the evidence, O=1, means probability 1/2. That happens when the prior odds are 1 over the Bayes factor.",
          c2: "How many times more likely the evidence is if the claim is true than if it is false. For a second independent test, multiply by the Bayes factor again.",
          c5: "Prior odds in the same direction as the posterior odds. Keep \"in favor\" and \"against\" from switching in the middle of the update."
        }
      }
    ]
  },
  {
    name: "Binomial and normal",
    items: [
      {
        title: "Binomial probabilities",
        tex: String.raw`\htmlClass{term c1}{P(X=k)}=\htmlClass{term c2}{\binom{n}{k}}\htmlClass{term c3}{p^{k}}\htmlClass{term c5}{(1-p)^{n-k}}`,
        parts: [
          "The ",
          { k: "c1", words: "chance of exactly k successes" },
          " is ",
          { k: "c2", words: "the number of sequences with those k successes" },
          ", times ",
          { k: "c3", words: "the chance of k successes" },
          ", times ",
          { k: "c5", words: "the chance of the failures" },
          "."
        ],
        notes: {
          c1: "X counts successes in a fixed number of trials. Each trial has two outcomes, the same success chance, and the trials are independent.",
          c2: "The binomial coefficient. For n=4 it is 1, 4, 6, 4, 1.",
          c3: "p to the power of the number of successes, not to the power of n.",
          c5: "One minus p, to the power of the number of failures. The two exponents add to n."
        }
      },
      {
        title: "Binomial mean and standard deviation",
        tex: String.raw`\htmlClass{term c2}{E(X)=np},\qquad \htmlClass{term c3}{\mathrm{Var}(X)=np(1-p)},\qquad \htmlClass{term c5}{\mathrm{sd}(X)=\sqrt{np(1-p)}}`,
        parts: [
          "A binomial count has ",
          { k: "c2", words: "mean n times p" },
          " and ",
          { k: "c3", words: "variance n times p times 1−p" },
          ". The ",
          { k: "c5", words: "standard deviation is the square root of the variance" },
          "."
        ],
        notes: {
          c2: "Four questions at p=0.2 give a mean of 0.8 correct. The mean does not have to be a whole number.",
          c3: "The variance is largest at p=1/2 and shrinks when p is near 0 or 1.",
          c5: "A z-score and a normal approximation use this standard deviation, not the variance."
        }
      },
      {
        title: "The cdf, and \"at least\"",
        tex: String.raw`\htmlClass{term c1}{F(k)=P(X\le k)},\qquad \htmlClass{term c4}{P(X\ge k)}=1-\htmlClass{term c2}{F(k-1)}`,
        parts: [
          { k: "c1", words: "F(k) is the chance the count is k or less" },
          ". The ",
          { k: "c4", words: "chance of at least k" },
          " is one minus ",
          { k: "c2", words: "F at k−1" },
          "."
        ],
        notes: {
          c1: "Add the point probabilities from 0 up through k. The last value of F is 1.",
          c4: "\"At least 2\" includes 2. It is everything that is not 0 or 1.",
          c2: "Subtracting F(k) would leave out the chance of exactly k."
        }
      },
      {
        title: "At least one success",
        tex: String.raw`\htmlClass{term c4}{P(X\ge 1)}=\htmlClass{term c2}{1}-\htmlClass{term c5}{(1-p)^{n}}`,
        parts: [
          "The ",
          { k: "c4", words: "chance of at least one success" },
          " is ",
          { k: "c2", words: "one" },
          " minus ",
          { k: "c5", words: "the chance that every trial fails" },
          "."
        ],
        notes: {
          c4: "This is less than 1 as long as a failure has some chance. A hundred plays of a 1-in-100 jackpot do not make a win certain.",
          c2: "The complement of \"none\".",
          c5: "For independent trials. If the failures are tied together, do not raise 1−p to the n."
        }
      },
      {
        title: "A z-score",
        tex: String.raw`\htmlClass{term c4}{z}=\frac{\htmlClass{term c2}{x}-\htmlClass{term c3}{\mu}}{\htmlClass{term c5}{\sigma}}`,
        parts: [
          "A ",
          { k: "c4", words: "z-score" },
          " says how many standard deviations ",
          { k: "c2", words: "a value" },
          " sits above ",
          { k: "c3", words: "the mean" },
          ", counted in units of ",
          { k: "c5", words: "the standard deviation" },
          "."
        ],
        notes: {
          c4: "A larger z means a smaller upper-tail probability. You can rank two suppliers by their z-scores without computing either probability.",
          c2: "The limit, the cutoff, or the observation you were given.",
          c3: "Subtract the mean of that distribution. Two groups with different means and different spreads each get their own z.",
          c5: "Divide by the standard deviation, not the variance. In N(μ, σ²) the second number is the variance."
        }
      },
      {
        title: "The one normal fact",
        tex: String.raw`\htmlClass{term c1}{P(|Z|\le 1.96)}=0.95,\qquad \htmlClass{term c5}{P(Z>1.96)}=0.025`,
        parts: [
          { k: "c1", words: "About 95% of a standard normal lies within 1.96 of zero" },
          ", so ",
          { k: "c5", words: "each tail, beyond 1.96, has probability 0.025" },
          "."
        ],
        notes: {
          c1: "For X normal, the same statement is μ ± 1.96σ. Half of the probability sits on each side of the mean.",
          c5: "The 5% outside the band is split by symmetry. The chance of exceeding μ+1.96σ is 0.025, not 0.05. A z below 1.96 has an upper tail larger than 0.025."
        }
      },
      {
        title: "A level in the tail",
        tex: String.raw`\htmlClass{term c2}{x}=\htmlClass{term c3}{\mu}+\htmlClass{term c5}{1.96\,\sigma}`,
        parts: [
          "The ",
          { k: "c2", words: "level exceeded only 2.5% of the time" },
          " is ",
          { k: "c3", words: "the mean" },
          " plus ",
          { k: "c5", words: "1.96 standard deviations" },
          "."
        ],
        notes: {
          c2: "This is the upper end of the 95% band. The lower end, exceeded from below 2.5% of the time, subtracts 1.96σ instead.",
          c3: "Use the mean of the distribution you are quoting a guarantee for.",
          c5: "Around a regression line, the same idea is the fitted value plus 1.96 times the residual standard deviation."
        }
      },
      {
        title: "A line through a normal",
        tex: String.raw`X\sim N(\mu,\sigma^2)\implies \htmlClass{term c1}{aX+b}\sim N\!\left(\htmlClass{term c2}{a\mu+b},\,\htmlClass{term c3}{a^2\sigma^2}\right)`,
        parts: [
          "If X is normal, then ",
          { k: "c1", words: "aX+b is normal" },
          ", with ",
          { k: "c2", words: "mean aμ+b" },
          " and ",
          { k: "c3", words: "variance a² times the variance of X" },
          "."
        ],
        notes: {
          c1: "A linear function of a normal is normal. The shape stays normal. Only the center and the spread change.",
          c2: "The mean follows the line, including a minus sign. If X has mean −2, then −2X has mean 4.",
          c3: "The variance squares the multiplier. If Var(X)=4 and the multiplier is −2, the new variance is 16. The second argument of N(μ, σ²) is that variance."
        }
      }
    ]
  },
  {
    name: "Linear regression",
    items: [
      {
        title: "Least squares slope and` intercept",
        tex: String.raw`\htmlClass{term c4}{\hat b}=\frac{\htmlClass{term c2}{\sum_i (x_i-\bar x)(y_i-\bar y)}}{\htmlClass{term c3}{\sum_i (x_i-\bar x)^2}},\qquad \htmlClass{term c5}{\hat a}=\bar y-\hat b\,\bar x`,
        parts: [
          "The ",
          { k: "c4", words: "slope" },
          " is ",
          { k: "c2", words: "how the y deviations line up with the x deviations" },
          ", divided by ",
          { k: "c3", words: "the sum of the squared x deviations" },
          ". The ",
          { k: "c5", words: "intercept puts the line through the point of averages" },
          "."
        ],
        notes: {
          c4: "In the units of y per unit of x. An extra mile, an extra square foot. It describes the line in this sample. It is not by itself the effect of changing x.",
          c2: "Pair each point's x deviation with its y deviation, multiply, and add. A point far from the average x gets a large vote.",
          c3: "The same denominator shows up when you ask how far one point moves the slope.",
          c5: "The intercept is the predicted y at x=0. If the data are nowhere near 0, that prediction is an extrapolation, not a measured value of the thing at zero."
        }
      },
      {
        title: "Fitted value and residual",
        tex: String.raw`\htmlClass{term c2}{\hat y_i}=\hat a+\hat b\,x_i,\qquad \htmlClass{term c5}{e_i}=\htmlClass{term c3}{y_i}-\htmlClass{term c4}{\hat y_i}`,
        parts: [
          "The ",
          { k: "c2", words: "fitted value is the height of the line at that x" },
          ". The ",
          { k: "c5", words: "residual" },
          " is ",
          { k: "c3", words: "the observed y" },
          " minus ",
          { k: "c4", words: "the fitted y" },
          "."
        ],
        notes: {
          c2: "Predict by plugging x into the line. Keep the units: a slope in thousands of dollars needs a y in thousands of dollars.",
          c5: "Positive means the observation is above the line. With an intercept in the model, the residuals add to 0.",
          c3: "What happened.",
          c4: "What the line expected. Least squares chooses the line that makes the sum of squared residuals as small as possible. It does not minimize the sum of the absolute residuals."
        }
      },
      {
        title: "How one point moves the slope",
        tex: String.raw`\htmlClass{term c1}{\Delta \hat b}=\htmlClass{term c5}{\Delta y}\,\frac{\htmlClass{term c4}{x_i-\bar x}}{\htmlClass{term c3}{\sum_j (x_j-\bar x)^2}}`,
        parts: [
          "A change in one response ",
          { k: "c1", words: "moves the slope" },
          " by ",
          { k: "c5", words: "that change in y" },
          ", times ",
          { k: "c4", words: "how far the point's x is from the average x" },
          ", divided by ",
          { k: "c3", words: "the sum of squared x deviations" },
          "."
        ],
        notes: {
          c1: "The intercept moves too, because it is tied to the slope through the point of averages. A point at the average x does not change the slope. It shifts the whole line.",
          c5: "How much that one y was revised, in the units of y.",
          c4: "A point at the edge of the x range tilts the line. A point in the middle does not.",
          c3: "The same denominator as in the slope formula."
        }
      },
      {
        title: "A band around the line",
        tex: String.raw`\htmlClass{term c1}{\hat y\pm 1.96\,\hat\sigma},\qquad \htmlClass{term c5}{e/\hat\sigma}`,
        parts: [
          "If the errors are normal with the same spread, about 95% of outcomes at a given x fall in ",
          { k: "c1", words: "the fitted value plus or minus 1.96 residual standard deviations" },
          ". A ",
          { k: "c5", words: "standardized residual is the residual divided by that standard deviation" },
          "."
        ],
        notes: {
          c1: "This band is for a new outcome at that x, using the residual standard deviation. It is the same 95% fact as in the normal section, centered on the line instead of on μ.",
          c5: "A standardized residual of 5 is far outside the band. Check the record before you delete the point. If large residuals grow with x, the equal-spread assumption is failing."
        }
      },
      {
        title: "Why the squares",
        tex: String.raw`Y_i\mid x_i\sim N(a+bx_i,\sigma^2)\implies \htmlClass{term c4}{\text{maximize likelihood}}\ =\ \htmlClass{term c5}{\text{minimize }\sum e_i^2}`,
        parts: [
          "When the errors are ",
          { k: "c4", words: "independent and normal, with one variance" },
          ", the line that maximizes the likelihood is the line that ",
          { k: "c5", words: "minimizes the sum of squared residuals" },
          "."
        ],
        notes: {
          c4: "That is the modeling assumption behind least squares, not a fact about every cloud of points. A curved pattern in the residual plot says the mean is not a straight line.",
          c5: "Squaring gives one large error a heavy vote, so the line moves toward that point. The sum of absolute residuals would treat a large error more gently."
        }
      }
    ]
  },
  {
    name: "Logistic regression",
    items: [
      {
        title: "The probability",
        tex: String.raw`\htmlClass{term c3}{z}=\beta_0+\beta_1 x,\qquad \htmlClass{term c4}{p}=\sigma(z)=\htmlClass{term c2}{\dfrac{1}{1+e^{-z}}}`,
        parts: [
          "The ",
          { k: "c3", words: "score z is a weighted sum of the predictors" },
          ". The ",
          { k: "c4", words: "probability" },
          " is ",
          { k: "c2", words: "that score passed through a curve that stays between 0 and 1" },
          "."
        ],
        notes: {
          c3: "A coefficient of 0.5 adds 0.5 to z for each extra unit, with the other predictors held fixed. An indicator that equals 1 adds its coefficient once.",
          c4: "Read p from the table of σ at that z. The curve is steepest at z=0, where p=0.5, and it flattens as z moves out.",
          c2: "Symmetry: 1−σ(z)=σ(−z). The chance of the other outcome is the curve at −z."
        }
      },
      {
        title: "Log-odds",
        tex: String.raw`\htmlClass{term c3}{z}=\htmlClass{term c1}{\log\frac{p}{1-p}}`,
        parts: [
          "The ",
          { k: "c3", words: "score" },
          " equals ",
          { k: "c1", words: "the log-odds" },
          "."
        ],
        notes: {
          c3: "A coefficient is a change in z, so it is a change in the log-odds. It is not a change in the probability. The same step in z moves p by a lot near 0.5 and by a little near 0 or 1.",
          c1: "Log of p over 1−p, natural log. Odds of 1, which is p=0.5, have log-odds 0."
        }
      },
      {
        title: "What a coefficient does to the odds",
        tex: String.raw`\htmlClass{term c5}{\dfrac{p_{\mathrm{new}}}{1-p_{\mathrm{new}}}}=\htmlClass{term c2}{e^{\beta}}\htmlClass{term c3}{\dfrac{p}{1-p}}`,
        parts: [
          "Raising the predictor by one ",
          { k: "c5", words: "replaces the odds" },
          " with ",
          { k: "c2", words: "e to the coefficient" },
          " times ",
          { k: "c3", words: "the old odds" },
          "."
        ],
        notes: {
          c5: "Odds, not probability. The probability cannot be pushed past 1.",
          c2: "A coefficient of 0.5 multiplies the odds by e^0.5. A coefficient of −2 divides the odds by e^2, the same as four steps of +0.5 in the other direction.",
          c3: "Hold the other predictors fixed. An annual-contract indicator offsets as many calls as its coefficient is large, measured in units of the calls coefficient."
        }
      },
      {
        title: "Log loss",
        tex: String.raw`\htmlClass{term c5}{-\,y\log p-(1-y)\log(1-p)}\ =\ -\log\htmlClass{term c4}{\,p^{y}(1-p)^{1-y}}`,
        parts: [
          "The ",
          { k: "c5", words: "log loss" },
          " is minus the log of ",
          { k: "c4", words: "the probability the model gave to what actually happened" },
          "."
        ],
        notes: {
          c5: "If y=1 the loss is −log p. If y=0 the loss is −log(1−p). A yes-or-no rule can call both mistakes one error. Log loss charges more when the model was sure and wrong.",
          c4: "This probability is p when y=1 and 1−p when y=0. For independent observations the likelihood is the product of these terms, so the total log loss is minus the log-likelihood. Minimizing the total log loss is maximum likelihood."
        }
      }
    ]
  }
];

const main = document.querySelector("#main");
const nav = document.querySelector("#nav");

groups.forEach((group, gi) => {
  const section = document.createElement("section");
  section.className = "group";
  section.id = "g" + gi;
  const h2 = document.createElement("h2");
  h2.textContent = group.name;
  section.appendChild(h2);
  const a = document.createElement("a");
  a.href = "#g" + gi;
  a.textContent = group.name;
  nav.appendChild(a);

  group.items.forEach((item, ii) => {
    const id = "f" + gi + "-" + ii;
    const card = document.createElement("article");
    card.id = id;
    const h3 = document.createElement("h3");
    h3.textContent = item.title;
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Hover over colored terms to explore their meaning";
    const eq = document.createElement("div");
    eq.className = "eq";
    eq.setAttribute("aria-label", item.title);
    const rule = document.createElement("hr");
    rule.className = "rule";
    const plain = document.createElement("p");
    plain.className = "plain";
    const note = document.createElement("p");
    note.className = "note";
    note.setAttribute("aria-live", "polite");

    item.parts.forEach((part) => {
      if (typeof part === "string") {
        plain.appendChild(document.createTextNode(part));
      } else {
        const span = document.createElement("span");
        span.className = "w " + part.k;
        span.dataset.k = part.k;
        span.tabIndex = 0;
        span.textContent = part.words;
        plain.appendChild(span);
      }
    });

    katex.render(item.tex, eq, {
      throwOnError: false,
      displayMode: true,
      trust: (context) => context.command === "\\htmlClass"
    });

    function terms(key) {
      return card.querySelectorAll("." + key);
    }
    function light(key) {
      card.classList.add("hot");
      card.querySelectorAll(".term, .w").forEach((el) => el.classList.remove("on"));
      if (key) terms(key).forEach((el) => el.classList.add("on"));
      note.textContent = key && item.notes[key] ? item.notes[key] : "";
    }
    function clearIf(key) {
      const active = card.querySelector(".on");
      if (!key || (active && active.classList.contains(key))) {
        card.classList.remove("hot");
        card.querySelectorAll(".on").forEach((el) => el.classList.remove("on"));
        note.textContent = "";
      }
    }
    [...eq.querySelectorAll(".term"), ...plain.querySelectorAll(".w")].forEach((el) => {
      const key = [...el.classList].find((c) => /^c\d$/.test(c));
      el.dataset.k = key;
      el.addEventListener("mouseenter", () => light(key));
      el.addEventListener("focus", () => light(key));
      el.addEventListener("mouseleave", () => clearIf(key));
      el.addEventListener("blur", () => clearIf(key));
      el.addEventListener("pointerup", (event) => {
        if (event.pointerType === "mouse") return;
        if (el.classList.contains("on") && card.classList.contains("hot")) clearIf(key);
        else light(key);
      });
    });

    card.append(h3, hint, eq, rule, plain, note);
    section.appendChild(card);
  });
  main.appendChild(section);
});
</script>
</body>
</html>
